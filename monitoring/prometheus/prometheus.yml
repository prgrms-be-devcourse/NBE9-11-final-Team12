global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: sisibibi-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: mysql
    static_configs:
      - targets:
          - mysqld-exporter:9104
