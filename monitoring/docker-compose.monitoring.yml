services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sisibibi-prometheus
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d

  loki:
    image: grafana/loki:3.1.0
    container_name: sisibibi-loki
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.1.0
    container_name: sisibibi-promtail
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - type: bind
        source: ../backend/logs
        target: /var/log/sisibibi
        read_only: true
        bind:
          create_host_path: false
      - promtail-positions:/var/lib/promtail
    command:
      - -config.file=/etc/promtail/config.yml


  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: sisibibi-node-exporter
    restart: unless-stopped
    mem_limit: 128m
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: sisibibi-redis-exporter
    restart: unless-stopped
    mem_limit: 128m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_ADDR: ${REDIS_EXPORTER_ADDR:-redis://host.docker.internal:26379}

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: sisibibi-mysqld-exporter
    restart: unless-stopped
    mem_limit: 128m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_SOURCE_NAME: ${MYSQL_EXPORTER_USER:-root}:${MYSQL_EXPORTER_PASSWORD:-root}@(${MYSQL_EXPORTER_ADDR:-host.docker.internal:23306})/

  grafana:
    image: grafana/grafana:11.1.0
    container_name: sisibibi-grafana
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - prometheus
      - loki
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus-data:
  loki-data:
  promtail-positions:
  grafana-data:
