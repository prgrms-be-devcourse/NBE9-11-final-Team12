server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

spring:
  application:
    name: sisibibi-api

  config:
    # backend 디렉토리가 아닌 루트 디렉토리에서 .env 가져옴
    import: optional:file:../.env[.properties]

  # Database 설정 (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:23306/sisibibi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD:root}

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 26379
      timeout: 2000ms # Redis 응답 지연 시 서버 멈춤 방지 (2초)

