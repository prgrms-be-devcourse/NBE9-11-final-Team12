server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

spring:
  application:
    name: sisibibi-api

  config:
    # backend 디렉토리가 아닌 루트 디렉토리에서 .env 가져옴
    import: optional:file:../.env[.properties]

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}

  # Database 설정 (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:23306/sisibibi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD:root}

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 26379
      timeout: 2000ms # Redis 응답 지연 시 서버 멈춤 방지 (2초)

  # JPA/Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: create # 개발 초기 환경용 (운영 환경에서는 반드시 none 또는 validate 사용)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100 # 배치 사이즈 설정 조정 필요
  ai:
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2

app:
  local:
    redis-reset-on-startup:
      enabled: ${LOCAL_REDIS_RESET_ON_STARTUP:false}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  websocket:
    presence:
      enabled: ${WEBSOCKET_PRESENCE_ENABLED:true}
      disconnect-grace-period: ${WEBSOCKET_PRESENCE_DISCONNECT_GRACE_PERIOD:60s}
      cleanup-retention: ${WEBSOCKET_PRESENCE_CLEANUP_RETENTION:10m}
      expiration-fixed-delay-ms: ${WEBSOCKET_PRESENCE_EXPIRATION_FIXED_DELAY_MS:5000}
      expiration-batch-size: ${WEBSOCKET_PRESENCE_EXPIRATION_BATCH_SIZE:100}
      max-expiration-failures: ${WEBSOCKET_PRESENCE_MAX_EXPIRATION_FAILURES:3}
      cleanup-fixed-delay-ms: ${WEBSOCKET_PRESENCE_CLEANUP_FIXED_DELAY_MS:60000}
      cleanup-batch-size: ${WEBSOCKET_PRESENCE_CLEANUP_BATCH_SIZE:100}
  speaking:
    turn-duration: ${SPEAKING_TURN_DURATION:3m}
    queue:
      summary-size: ${SPEAKING_QUEUE_SUMMARY_SIZE:5}
      default-page-size: ${SPEAKING_QUEUE_DEFAULT_PAGE_SIZE:20}
      max-page-size: ${SPEAKING_QUEUE_MAX_PAGE_SIZE:100}
    assignment:
      enabled: ${SPEAKING_ASSIGNMENT_ENABLED:true}
      fixed-delay-ms: ${SPEAKING_ASSIGNMENT_FIXED_DELAY_MS:10000}
    expiration:
      enabled: ${SPEAKING_EXPIRATION_ENABLED:true}
      fixed-delay-ms: ${SPEAKING_EXPIRATION_FIXED_DELAY_MS:1000}
  ai-report:
    base-url: ${AI_REPORT_BASE_URL:http://localhost:8000}
    generate-path: ${AI_REPORT_GENERATE_PATH:/report}
    timeout: ${AI_REPORT_TIMEOUT:5m}
    pdf:
      enabled: ${AI_REPORT_PDF_ENABLED:true}
      presigned-url-expiration: ${AI_REPORT_PDF_PRESIGNED_URL_EXPIRATION:10m}
      max-pdf-retry-count: ${AI_REPORT_PDF_MAX_RETRY_COUNT:3}
      max-notification-retry-count: ${AI_REPORT_NOTIFICATION_MAX_RETRY_COUNT:5}
      retry-fixed-delay-ms: ${AI_REPORT_PDF_RETRY_FIXED_DELAY_MS:60000}
      retry-stale-threshold: ${AI_REPORT_PDF_RETRY_STALE_THRESHOLD:1m}
      retry-batch-size: ${AI_REPORT_PDF_RETRY_BATCH_SIZE:20}
    notification:
      provider: ${AI_REPORT_NOTIFICATION_PROVIDER:smtp}
      from-email: ${AI_REPORT_NOTIFICATION_FROM_EMAIL:}
      homepage-url: ${FRONTEND_URL:http://localhost:3000}
  ai-counter-issue:
    generate-timeout: ${AI_COUNTER_ISSUE_GENERATE_TIMEOUT:10s}
    max-generation-attempts: ${AI_COUNTER_ISSUE_MAX_GENERATION_ATTEMPTS:3}
  stage-summary:
    enabled: ${STAGE_SUMMARY_ENABLED:true}
    generate-timeout: ${STAGE_SUMMARY_GENERATE_TIMEOUT:10s}
    max-generation-attempts: ${STAGE_SUMMARY_MAX_GENERATION_ATTEMPTS:3}
    min-completed-speaker-count: ${STAGE_SUMMARY_MIN_COMPLETED_SPEAKER_COUNT:10}
    recovery-batch-size: ${STAGE_SUMMARY_RECOVERY_BATCH_SIZE:20}
    recovery-fixed-delay-ms: ${STAGE_SUMMARY_RECOVERY_FIXED_DELAY_MS:60000}
  off-topic-ai-review:
    enabled: ${OFF_TOPIC_AI_REVIEW_ENABLED:true}
    min-report-threshold: ${OFF_TOPIC_AI_REVIEW_MIN_REPORT_THRESHOLD:5}
    generate-timeout: ${OFF_TOPIC_AI_REVIEW_GENERATE_TIMEOUT:10s}
    worker-token: ${AI_REPORT_WORKER_TOKEN:}
    queue:
      queue-url: ${AI_REPORT_QUEUE_URL:}
      region: ${AI_REPORT_QUEUE_REGION:ap-northeast-2}
      retry:
        enabled: ${AI_REPORT_QUEUE_RETRY_ENABLED:true}
        fixed-delay-ms: ${AI_REPORT_QUEUE_RETRY_FIXED_DELAY_MS:30000}
        stale-threshold: ${AI_REPORT_QUEUE_RETRY_STALE_THRESHOLD:30s}
        batch-size: ${AI_REPORT_QUEUE_RETRY_BATCH_SIZE:20}
        max-retry-count: ${AI_REPORT_QUEUE_RETRY_MAX_RETRY_COUNT:5}
  prompt-guard:
    base-url: ${PROMPT_GUARD_BASE_URL:}
    scan-path: ${PROMPT_GUARD_SCAN_PATH:/scan}
    connect-timeout: ${PROMPT_GUARD_CONNECT_TIMEOUT:500ms}
    read-timeout: ${PROMPT_GUARD_READ_TIMEOUT:1000ms}
    fail-open: ${PROMPT_GUARD_FAIL_OPEN:false}
    custom-prompt-max-count: ${PROMPT_GUARD_CUSTOM_PROMPT_MAX_COUNT:5}
    custom-prompt-max-length: ${PROMPT_GUARD_CUSTOM_PROMPT_MAX_LENGTH:1000}
  auth:
    jwt:
      secret: ${JWT_SECRET:local-development-jwt-secret-key-must-be-at-least-32-bytes}
      access-token-expiration: 30m
      refresh-token-expiration: 14d
    cookie:
      secure: false
      same-site: Lax
      domain:
  storage:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${S3_BUCKET_NAME:}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
      presigned-url-expiration: ${S3_PRESIGNED_URL_EXPIRATION:10m}
      max-image-size: ${SPEECH_IMAGE_MAX_SIZE:5242880}
      access-key-id: ${AWS_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  outbox:
    relay:
      enabled: false
      fixed-delay-ms: 30000
  payment:
    toss:
      secret-key: ${TOSS_SECRET_KEY}

naver:
  search:
    news-url: ${NAVER_NEWS_SEARCH_URL:https://openapi.naver.com/v1/search/news.json}
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    csrf:
      enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    disable-swagger-default-url: true

serpapi:
  base-url: ${SERPAPI_BASE_URL:https://serpapi.com/search.json}
  api-key: ${SERPAPI_API_KEY:}

room-ranking:
  rebuild-on-startup: false