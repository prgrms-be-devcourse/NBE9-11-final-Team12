spring:
  threads:
    virtual:
      enabled: ${PERFORMANCE_VIRTUAL_THREADS_ENABLED:false}
  datasource:
    hikari:
      maximum-pool-size: ${PERFORMANCE_HIKARI_MAXIMUM_POOL_SIZE:40}
      minimum-idle: ${PERFORMANCE_HIKARI_MINIMUM_IDLE:20}
      connection-timeout: ${PERFORMANCE_HIKARI_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

app:
  websocket:
    channel:
      inbound:
        core-pool-size: ${PERFORMANCE_WEBSOCKET_INBOUND_CORE_POOL_SIZE:8}
        max-pool-size: ${PERFORMANCE_WEBSOCKET_INBOUND_MAX_POOL_SIZE:32}
        queue-capacity: ${PERFORMANCE_WEBSOCKET_INBOUND_QUEUE_CAPACITY:5000}
      outbound:
        core-pool-size: ${PERFORMANCE_WEBSOCKET_OUTBOUND_CORE_POOL_SIZE:8}
        max-pool-size: ${PERFORMANCE_WEBSOCKET_OUTBOUND_MAX_POOL_SIZE:32}
        queue-capacity: ${PERFORMANCE_WEBSOCKET_OUTBOUND_QUEUE_CAPACITY:5000}
    heartbeat:
      pool-size: ${PERFORMANCE_WEBSOCKET_HEARTBEAT_POOL_SIZE:8}
