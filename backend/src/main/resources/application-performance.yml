spring:
  threads:
    virtual:
      enabled: ${PERFORMANCE_VIRTUAL_THREADS_ENABLED:false}
  datasource:
    hikari:
      maximum-pool-size: ${PERFORMANCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${PERFORMANCE_HIKARI_MINIMUM_IDLE:10}
      connection-timeout: ${PERFORMANCE_HIKARI_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
