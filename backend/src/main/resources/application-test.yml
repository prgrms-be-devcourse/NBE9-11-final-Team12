spring:
  ai:
    openai:
      api-key: test-openai-api-key

  datasource:
    url: jdbc:h2:mem:sisibibi-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false

app:
  speaking:
    assignment:
      enabled: false
    expiration:
      enabled: false

room-ranking:
  rebuild-on-startup: false
