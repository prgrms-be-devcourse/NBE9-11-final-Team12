spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:mem:sisibibi-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: ERROR
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF

app:
  speaking:
    expiration:
      enabled: false
