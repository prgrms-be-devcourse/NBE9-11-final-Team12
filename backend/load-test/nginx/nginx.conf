worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    access_log off;
    error_log /var/log/nginx/error.log warn;

    upstream sisibibi_stage_backend {
        least_conn;
        server host.docker.internal:8080 max_fails=3 fail_timeout=10s;
        server host.docker.internal:8081 max_fails=3 fail_timeout=10s;
        keepalive 256;
    }

    server {
        listen 8088 backlog=8192;

        location / {
            proxy_pass http://sisibibi_stage_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
        }
    }
}