[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-report-model-test"
version = "0.1.0"
description = "Standalone harness for testing open-source models on AI debate report generation."
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_test*"]
