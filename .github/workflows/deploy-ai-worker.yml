name: deploy-ai-worker

env:
  IMAGE_NAME: sisibibi-ai-worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-ai-worker.yml"
      - "ai_test/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-ai-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildImagePushAndDeploy:
    name: Build, push, and deploy AI Worker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        id: export_owner
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ai_test
          file: ai_test/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.export_owner.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ steps.export_owner.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure personal AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PERSONAL_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PERSONAL_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.PERSONAL_AWS_REGION }}

      - name: Encode AI Worker secrets
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DOT_AI_ENV: ${{ secrets.DOT_AI_ENV }}
        run: |
          if [ -z "$DOT_AI_ENV" ]; then
            echo "DOT_AI_ENV secret is empty."
            exit 1
          fi
          echo "GHCR_TOKEN_B64=$(printf '%s' "$GHCR_TOKEN" | base64 -w0)" >> "$GITHUB_ENV"
          echo "DOT_AI_ENV_B64=$(printf '%s' "$DOT_AI_ENV" | base64 -w0)" >> "$GITHUB_ENV"

      - name: Restart AI Worker through SSM
        env:
          AI_WORKER_INSTANCE_ID: ${{ secrets.AI_WORKER_INSTANCE_ID }}
        run: |
          set -euo pipefail

          PING_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$AI_WORKER_INSTANCE_ID" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text)

          if [ "$PING_STATUS" != "Online" ]; then
            echo "AI Worker instance is not online through SSM. Start the instance and rerun this workflow."
            exit 0
          fi

          DEPLOY_SCRIPT=$(cat << 'SCRIPT_EOF'
          set -Eeuo pipefail

          SCRIPT_TS="$(date +%Y%m%d_%H%M%S)"
          LOG="/tmp/ssm-ai-worker-${SCRIPT_TS}.log"

          exec > >(awk '{ fflush(); print strftime("[%Y-%m-%d %H:%M:%S]"), $0 }' | tee -a "$LOG")
          exec 2> >(awk '{ fflush(); print strftime("[%Y-%m-%d %H:%M:%S]"), $0 }' | tee -a "$LOG" >&2)

          echo "===== AI Worker Deploy Start ====="

          [[ -f /opt/ai-worker/run-worker.sh ]] || {
            echo "/opt/ai-worker/run-worker.sh is missing"
            exit 1
          }

          sudo install -d -m 700 -o root -g root /etc/ai-worker
          printf '%s' "${{ env.DOT_AI_ENV_B64 }}" \
            | base64 -d \
            | sudo tee /etc/ai-worker/ai-worker.env >/dev/null
          sudo chown root:root /etc/ai-worker/ai-worker.env
          sudo chmod 600 /etc/ai-worker/ai-worker.env

          printf '%s' "${{ env.GHCR_TOKEN_B64 }}" \
            | base64 -d \
            | sudo docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

          sudo systemctl restart ai-worker.service
          sudo systemctl status ai-worker.service --no-pager
          sudo docker ps --filter name=ai-report-worker

          echo "===== AI Worker Deploy Complete ====="
          SCRIPT_EOF
          )

          PARAMS=$(jq -nc --arg s "$DEPLOY_SCRIPT" '{"commands":[$s]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$AI_WORKER_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy AI Worker $GITHUB_SHA" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          WAIT_MAX=900
          WAIT_INTERVAL=10
          WAIT_ELAPSED=0

          while (( WAIT_ELAPSED < WAIT_MAX )); do
            CMD_STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$AI_WORKER_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Unknown")

            echo "Current status: $CMD_STATUS"

            if [[ "$CMD_STATUS" != "InProgress" && "$CMD_STATUS" != "Pending" ]]; then
              break
            fi

            sleep "$WAIT_INTERVAL"
            WAIT_ELAPSED=$((WAIT_ELAPSED + WAIT_INTERVAL))
          done

          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$AI_WORKER_INSTANCE_ID")

          STATUS=$(echo "$INVOCATION" | jq -r '.Status')

          echo "===== stdout ====="
          echo "$INVOCATION" | jq -r '.StandardOutputContent'
          echo "===== stderr ====="
          echo "$INVOCATION" | jq -r '.StandardErrorContent'
          echo "=================="
          echo "Status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
