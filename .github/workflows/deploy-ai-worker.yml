name: deploy-ai-worker

env:
  IMAGE_NAME: sisibibi-ai-worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-ai-worker.yml"
      - "ai_test/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  buildImageAndPush:
    name: Build and push AI Worker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        id: export_owner
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ai_test
          file: ai_test/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.export_owner.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ steps.export_owner.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
