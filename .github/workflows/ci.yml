name: CI

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build -x test

      - name: Run tests and JaCoCo report
        run: ./gradlew test jacocoTestReport

      - name: Run formatting check
        run: |
          if ./gradlew tasks --all --console=plain | grep -q '^spotlessCheck '; then
            ./gradlew spotlessCheck
          else
            echo "spotlessCheck task not found. Skipping."
          fi

      - name: Run Java lint
        run: |
          if ./gradlew tasks --all --console=plain | grep -q '^checkstyleMain '; then
            ./gradlew checkstyleMain
          else
            echo "checkstyleMain task not found. Skipping."
          fi

      - name: Run Kotlin lint
        run: |
          if ./gradlew tasks --all --console=plain | grep -q '^ktlintCheck '; then
            ./gradlew ktlintCheck
          else
            echo "ktlintCheck task not found. Skipping."
          fi

      - name: Run architecture tests
        run: |
          if find . \( -name '*ArchitectureTest.java' -o -name '*ArchitectureTest.kt' \) | grep -q .; then
            ./gradlew test --tests '*ArchitectureTest'
          else
            echo "ArchitectureTest not found. Skipping."
          fi

      - name: Run database schema tests
        run: |
          if find . \( -name '*DatabaseSchemaTest.java' -o -name '*DatabaseSchemaTest.kt' \) | grep -q .; then
            ./gradlew test --tests '*DatabaseSchemaTest'
          else
            echo "DatabaseSchemaTest not found. Skipping."
          fi

      - name: Build Docker image
        run: |
          if test -f Dockerfile; then
            docker build -t backend-harness-ci .
          else
            echo "Dockerfile not found. Skipping Docker build."
          fi

      - name: Check required secret placeholders
        shell: bash
        run: |
          if grep -R "password: *[a-zA-Z0-9]" src/main/resources 2>/dev/null; then
            echo "Possible hardcoded password found."
            exit 1
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: backend/build/reports/jacoco/test/html

      - name: Add JaCoCo summary
        if: always()
        run: |
          REPORT="build/reports/jacoco/test/html/index.html"

          {
            echo "## JaCoCo Coverage Report"

            if test -f "$REPORT"; then
              echo "✅ JaCoCo report generated successfully."
              echo "- HTML artifact: \`jacoco-html-report\`"
              echo "- Download the artifact and open \`index.html\`."
            else
              echo "❌ JaCoCo HTML report was not found at \`$REPORT\`."
              echo "- Check whether \`jacocoTestReport\` completed successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
